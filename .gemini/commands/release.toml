# In: ~/.gemini/commands/release.toml
# Invoked via: /release 4.1.0

description = "发布新版本"
prompt = """

  核心任务: 你是一个负责执行标准化软件发布流程的工程助理。你需要严格按照以下步骤，为一个用户脚本项
  目发布一个新版本。

  版本信息:
   * 新版本号: {{args}}
   * 上一个版本号: [填写上一个版本号, 例如: 4.0.2]

  ---

  发布流程

  步骤 1: 预检与读取

   1. 同时读取 S1Plus.js、CHANGELOG.md、README.md。
   2. 从 S1Plus.js 中提取并核对:
      * // @version
      * const SCRIPT_VERSION
      * const SCRIPT_RELEASE_DATE
   3. 必须确认 // @version 与 SCRIPT_VERSION 当前值一致；不一致则停止并报告。
   4. 必须确认 {{args}} 与当前版本不同。

  步骤 2: 先生成“升级弹窗草案”（只预览，不继续发布）

   1. 定位函数: 在 S1Plus.js 中找到 showFirstTimeWelcomeIfNeeded。
   2. 基于当前 ## [Unreleased] 内容，生成一版 bodyHtml 更新亮点草案。
   3. 文案要求:
      * 面向一般用户，强调“变化结果/用户收益”，避免底层实现细节堆砌。
      * 控制为 3-5 条精简亮点，按主题归纳（如安全、同步、体验）。
      * 保持标题格式不变（S1 Plus v${SCRIPT_VERSION} 更新亮点）。

  步骤 3: 人工确认检查点（强制）

   1. 将步骤 2 生成的弹窗草案完整展示给用户检查。
   2. 明确询问是否确认该草案。
   3. 如果用户要求修改，只允许继续迭代弹窗草案，直到用户确认。
   4. 在用户明确确认前，禁止执行后续步骤（版本号更新、CHANGELOG rollout、commit、tag）。

  步骤 4: 用户确认后，更新版本号与弹窗

   1. 更新 S1Plus.js:
      * 将 // @version 改为 {{args}}。
      * 将 const SCRIPT_VERSION 改为 {{args}}。
      * 将 SCRIPT_RELEASE_DATE 改为发布当天。
   2. 将“已确认”的弹窗草案写入 showFirstTimeWelcomeIfNeeded 的 bodyHtml。
   3. 复核以上字段，确保已落盘且一致。

  步骤 5: 更新 CHANGELOG.md

   1. 遵循格式:
      * 顶部保留空的 ## [Unreleased]。
      * 每个已发布版本使用独立二级标题（如 ## [v4.0.2] - YYYY-MM-DD）。
      * 不同版本标题之间必须有 --- 分割线。
   2. 执行更新:
      * 在 ## [Unreleased] 下方创建 ## [v{{args}}] - [当前日期]。
      * 将 ## [Unreleased] 下的内容移动到新版本标题下。
      * 确保 ## [Unreleased] 最终为空。

  步骤 6: 校准并刷新 README.md

   1. 读取文件: 首先，同时读取 S1Plus.js 和 README.md 的内容。
   2. 提取新元数据: 从 S1Plus.js 文件中，提取出更新后的完整元数据块。
   3. 更新 readme：根据目前代码所有的实现，更新 readme，确保说明各项说明能准确反映脚本的**完整功能**，而不是罗列本次更新的增量。
   

  步骤 7: 提交发布变更

   1. 暂存文件: 使用 git add . 将所有修改过的文件（S1Plus.js、CHANGELOG.md 和 README.md）添加到暂存区。
   2. 检查历史: 使用 git log -n 3 查看最近的提交历史，以确认提交信息的风格。
   3. 提交变更: 使用 git commit 创建一个格式统一的发布提交。提交信息必须严格遵循以下格式：
   1     release: v{{args}}
      示例: git commit -m "release: v4.1.0"

  步骤 8: 创建 Git 标签

   1. 打上标签: 为刚刚的发布提交创建一个新的 Git 标签。标签名必须严格遵循以下格式：

   1     v{{args}}
      示例: git tag v4.1.0

  ---

  通用注意事项

   * 原子性操作: 严格按照顺序，一次执行一个步骤。在继续下一步之前，请确认上一步已成功完成。
   * 文件内容校验: 至关重要！在任何时候，当你需要修改一个文件时（尤其是 CHANGELOG.md），都必须先用
     read_file 读取其最新内容，然后再使用 write_file 或 replace
     进行修改。这可以防止因内容不同步而导致的操作失败。
   * 强制确认门槛: 必须先展示弹窗草案并得到用户确认。未确认前不得继续版本更新、提交或打标签。
   * 文案一致性校验: 发布前必须确认 showFirstTimeWelcomeIfNeeded 的 bodyHtml 与本次 v{{args}} Changelog 对齐，且表达为“面向普通用户”的精简说明。
   * 遵循约定: 严格遵守项目中既定的版本号格式、Changelog 格式、提交信息格式和标签格式。
   * 最终确认: 完成所有步骤后，向用户报告发布成功，并询问是否需要将提交和标签推送到远程仓库 (git push
      && git push --tags)。

"""
