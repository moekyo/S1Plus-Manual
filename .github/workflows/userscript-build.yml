name: Userscript Build

on:
  pull_request:
    paths:
      - "S1Plus.js"
      - "src/**"
      - "scripts/**"
      - "tests/build/**"
      - "tests/s1plus-test-helpers.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/userscript-build.yml"
  push:
    branches:
      - main
      - codex/s1plus-modularization-foundation
    paths:
      - "S1Plus.js"
      - "src/**"
      - "scripts/**"
      - "tests/build/**"
      - "tests/s1plus-test-helpers.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/userscript-build.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@12.0.1

      - name: Install locked dependencies
        run: npm ci

      - name: Verify userscript bundle
        run: npm run verify:bundle

      - name: Verify representative CommonJS tests
        run: |
          node tests/settings-migration/test-settings-migration.js
          node tests/test-settings-semantics-module.js
          node tests/test-sync-system-facade.js

      - name: Ensure tracked files stay clean
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
