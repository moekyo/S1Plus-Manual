name: Apply page projection review fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: page-projection-review-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Apply fixes and run focused tests
        shell: bash
        run: |
          set -o pipefail
          (
            set -e
            node scripts/apply-page-projection-review-fixes.mjs
            node tests/test-page-enhancement-projection.js
            node tests/test-settings-semantics-module.js
            node tests/test-core-business-data-module.js
            node tests/test-image-viewer-interface.js
            git diff --check
          ) 2>&1 | tee page-projection-fix.log

      - name: Upload patched files and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-projection-review-fixes
          if-no-files-found: warn
          path: |
            page-projection-fix.log
            page-projection-fix-result.txt
            src/legacy/main.js
            S1Plus.js
            tests/test-page-enhancement-projection.js
